</head><body><div class="header">
    <a href="/dashboard" class="back">← Back</a>

    <h2>🤖 Examora AI Tutor</h2>

    <p>
        Ask questions • Understand concepts • Learn better
    </p>
</div>

<div id="chat-box">

    <div class="message ai-message">
        Assalam-o-Alaikum! 👋

        I am your Examora AI Tutor.

        Ask me anything about your studies. I will try to explain it according to your education level.
    </div>

</div>

<div class="input-area">

    <input
        type="text"
        id="message"
        placeholder="Ask Examora AI..."
        autocomplete="off"
    >

    <button id="send-btn" onclick="sendMessage()">
        Send
    </button>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chatBox = document.getElementById("chat-box");
    const button = document.getElementById("send-btn");

    const message = input.value.trim();

    if (!message) return;


    const userMessage = document.createElement("div");

    userMessage.className = "message user-message";

    userMessage.textContent = message;

    chatBox.appendChild(userMessage);


    input.value = "";

    button.disabled = true;

    button.textContent = "Thinking...";


    try {

        const response = await fetch("/api/ai-tutor", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();


        const aiMessage = document.createElement("div");

        aiMessage.className = "message ai-message";


        if (data.success) {

            aiMessage.textContent = data.answer;

        } else {

            aiMessage.textContent =
                "Sorry, Examora AI is temporarily unavailable.";

        }


        chatBox.appendChild(aiMessage);


    } catch (error) {

        const errorMessage = document.createElement("div");

        errorMessage.className = "message ai-message";

        errorMessage.textContent =
            "Connection error. Please try again.";

        chatBox.appendChild(errorMessage);

    }



    button.disabled = false;

    button.textContent = "Send";


    chatBox.scrollTop = chatBox.scrollHeight;

}


document.getElementById("message").addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});

</script></body>
</html>
