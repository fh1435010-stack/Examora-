<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Examora AI Tutor</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0b0b0d;
            --surface: #202124;
            --surface-light: #2a2b2f;
            --border: #3a3b40;
            --text: #f5f5f5;
            --muted: #a8a8ad;
            --accent: #21d4c2;
            --accent-dark: #102d2a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(11, 11, 13, 0.96);
            backdrop-filter: blur(12px);
        }

        .top-left,
        .top-right {
            width: 56px;
            display: flex;
            align-items: center;
        }

        .top-right {
            justify-content: flex-end;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #1d1e22;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            text-decoration: none;
        }

        .icon-button:active {
            transform: scale(0.95);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: bold;
            font-size: 17px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                var(--accent),
                #5c8cff
            );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #061010;
            font-weight: bold;
        }


        /* =========================
           CHAT AREA
        ========================= */

        #chat-box {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding:
                22px
                16px
                140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            margin: auto 0;
            text-align: center;
            padding: 35px 10px;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: linear-gradient(
                135deg,
                var(--accent),
                #5c8cff
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #071111;
        }

        .welcome h1 {
            margin: 0;
            font-size: 28px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
            max-width: 550px;
            margin: 12px auto 0;
            font-size: 15px;
        }


        /* =========================
           SUGGESTIONS
        ========================= */

        .suggestions {
            width: 100%;
            max-width: 600px;
            margin: 28px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .suggestion {
            background: #17181b;
            border: 1px solid #292a2f;
            border-radius: 15px;
            color: var(--text);
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            line-height: 1.45;
        }

        .suggestion span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .suggestion:active {
            transform: scale(0.98);
        }


        /* =========================
           MESSAGES
        ========================= */

        .message-row {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .message-row.user-row {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .ai-avatar {
            background: linear-gradient(
                135deg,
                var(--accent),
                #5c8cff
            );
            color: #071111;
        }

        .user-avatar {
            background: #303136;
            color: white;
        }

        .message-content {
            max-width: min(760px, 82%);
            line-height: 1.65;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ai-content {
            padding-top: 5px;
            color: #eeeeee;
        }

        .user-content {
            background: #24252a;
            padding: 12px 16px;
            border-radius:
                20px
                20px
                5px
                20px;
        }

        .provider-label {
            margin-top: 8px;
            font-size: 11px;
            color: #77787d;
        }


        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 0;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }

        }


        /* =========================
           INPUT AREA
        ========================= */

        .composer-wrapper {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding:
                12px
                14px
                max(18px, env(safe-area-inset-bottom));
            background: linear-gradient(
                to top,
                var(--bg) 75%,
                transparent
            );
        }

        .composer {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: #25262a;
            border: 1px solid #3a3b40;
            border-radius: 28px;
            min-height: 58px;
            padding: 7px;
            display: flex;
            align-items: flex-end;
            gap: 7px;
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.35);
        }

        .composer-button {
            width: 44px;
            height: 44px;
            border: none;
            flex-shrink: 0;
            border-radius: 50%;
            background: transparent;
            color: #c5c6ca;
            font-size: 24px;
            cursor: pointer;
        }

        #message {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.45;
            padding: 12px 2px;
            max-height: 130px;
        }

        #message::placeholder {
            color: #97989d;
        }

        #send-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: #071111;
            font-size: 19px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .footer-note {
            text-align: center;
            color: #6e6f74;
            font-size: 11px;
            margin-top: 9px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .top-bar {
                height: 58px;
            }

            #chat-box {
                padding-left: 14px;
                padding-right: 14px;
            }

            .welcome {
                padding-top: 20px;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .message-content {
                max-width: 84%;
            }

            .composer-wrapper {
                padding-left: 10px;
                padding-right: 10px;
            }

        }

    </style>
</head>

<body>

<div class="app">


    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="top-left">
            <a
                href="/dashboard"
                class="icon-button"
                title="Back to dashboard"
            >
                ☰
            </a>
        </div>


        <div class="brand">

            <div class="brand-logo">
                E
            </div>

            <span>
                Examora AI
            </span>

        </div>


        <div class="top-right">

            <button
                class="icon-button"
                onclick="clearChat()"
                title="New conversation"
            >
                ↻
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <main id="chat-box">

        <section
            class="welcome"
            id="welcome-screen"
        >

            <div class="welcome-logo">
                ✦
            </div>

            <h1>
                How can I help you learn?
            </h1>

            <p>
                I am Examora AI Tutor. Ask me about your studies,
                difficult concepts, exam preparation, and academic topics.
            </p>


            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion('Explain this topic in simple words according to my class level.')"
                >
                    Explain a difficult topic
                    <span>
                        Learn step by step
                    </span>
                </button>


                <button
                    class="suggestion"
                    onclick="useSuggestion('Help me prepare for my exam. Make a simple study plan.')"
                >
                    Prepare for an exam
                    <span>
                        Create a study plan
                    </span>
                </button>


                <button
                    class="suggestion"
                    onclick="useSuggestion('Give me a practice question according to my education level.')"
                >
                    Practice a concept
                    <span>
                        Test your understanding
                    </span>
                </button>


                <button
                    class="suggestion"
                    onclick="useSuggestion('Explain my mistake and help me understand the correct concept.')"
                >
                    Understand mistakes
                    <span>
                        Learn from errors
                    </span>
                </button>

            </div>

        </section>

    </main>


    <!-- COMPOSER -->

    <div class="composer-wrapper">

        <div class="composer">

            <button
                class="composer-button"
                type="button"
                title="More features coming soon"
            >
                +
            </button>


            <textarea
                id="message"
                placeholder="Ask Examora AI anything..."
                rows="1"
                autocomplete="off"
            ></textarea>


            <button
                class="composer-button"
                type="button"
                title="Voice input coming soon"
            >
                ♫
            </button>


            <button
                id="send-btn"
                type="button"
                onclick="sendMessage()"
                title="Send"
            >
                ↑
            </button>

        </div>


        <div class="footer-note">
            Examora AI can make mistakes. Important information should be verified.
        </div>

    </div>


</div>


<script>


const input =
    document.getElementById("message");

const chatBox =
    document.getElementById("chat-box");

const sendButton =
    document.getElementById("send-btn");

const welcomeScreen =
    document.getElementById("welcome-screen");


/* AUTO RESIZE */

input.addEventListener(
    "input",
    function () {

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }
);


/* ENTER TO SEND */

input.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* USE SUGGESTION */

function useSuggestion(text) {

    input.value = text;

    input.focus();

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            130
        ) + "px";

}


/* CREATE USER MESSAGE */

function addUserMessage(text) {

    const row =
        document.createElement("div");

    row.className =
        "message-row user-row";


    const content =
        document.createElement("div");

    content.className =
        "message-content user-content";

    content.textContent =
        text;


    row.appendChild(content);

    chatBox.appendChild(row);

}


/* CREATE AI MESSAGE */

function addAIMessage(
    text,
    provider = null
) {

    const row =
        document.createElement("div");

    row.className =
        "message-row";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar ai-avatar";

    avatar.textContent =
        "E";


    const wrapper =
        document.createElement("div");


    const content =
        document.createElement("div");

    content.className =
        "message-content ai-content";

    content.textContent =
        text;


    wrapper.appendChild(content);


    if (provider) {

        const providerLabel =
            document.createElement("div");

        providerLabel.className =
            "provider-label";

        providerLabel.textContent =
            "Answered using " + provider;

        wrapper.appendChild(
            providerLabel
        );

    }


    row.appendChild(avatar);

    row.appendChild(wrapper);

    chatBox.appendChild(row);

}


/* TYPING INDICATOR */

function showTyping() {

    const row =
        document.createElement("div");

    row.className =
        "message-row";

    row.id =
        "typing-indicator";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar ai-avatar";

    avatar.textContent =
        "E";


    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const dot =
            document.createElement("div");

        dot.className =
            "typing-dot";

        typing.appendChild(dot);

    }


    row.appendChild(avatar);

    row.appendChild(typing);

    chatBox.appendChild(row);

    scrollToBottom();

}


function removeTyping() {

    const typing =
        document.getElementById(
            "typing-indicator"
        );

    if (typing) {

        typing.remove();

    }

}


/* SCROLL */

function scrollToBottom() {

    setTimeout(
        function () {

            window.scrollTo(
                0,
                document.body.scrollHeight
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        },
        50
    );

}


/* SEND MESSAGE */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    if (welcomeScreen) {

        welcomeScreen.style.display =
            "none";

    }


    addUserMessage(message);


    input.value = "";

    input.style.height = "auto";


    sendButton.disabled =
        true;

    sendButton.textContent =
        "…";


    showTyping();


    scrollToBottom();


    try {

        const response =
            await fetch(
                "/api/ai-tutor",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: message
                        })
                }
            );


        const data =
            await response.json();


        removeTyping();


        if (data.success) {

            addAIMessage(
                data.answer,
                data.provider
            );

        } else {

            addAIMessage(
                data.error ||
                "Sorry, Examora AI is temporarily unavailable."
            );

        }

    }


    catch (error) {

        removeTyping();


        addAIMessage(
            "Connection error. Please check your internet connection and try again."
        );

    }


    finally {

        sendButton.disabled =
            false;

        sendButton.textContent =
            "↑";

        scrollToBottom();

        input.focus();

    }

}


/* CLEAR CHAT */

function clearChat() {

    chatBox.innerHTML = "";

    const welcome =
        document.createElement("section");

    welcome.className =
        "welcome";

    welcome.id =
        "welcome-screen";


    welcome.innerHTML = `

        <div class="welcome-logo">
            ✦
        </div>

        <h1>
            How can I help you learn?
        </h1>

        <p>
            I am Examora AI Tutor. Ask me about your studies,
            difficult concepts,
            exam preparation, and academic topics.
        </p>

        <div class="suggestions">

            <button
                class="suggestion"
                onclick="useSuggestion('Explain this topic in simple words according to my class level.')"
            >
                Explain a difficult topic
                <span>
                    Learn step by step
                </span>
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Help me prepare for my exam. Make a simple study plan.')"
            >
                Prepare for an exam
                <span>
                    Create a study plan
                </span>
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Give me a practice question according to my education level.')"
            >
                Practice a concept
                <span>
                    Test your understanding
                </span>
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Explain my mistake and help me understand the correct concept.')"
            >
                Understand mistakes
                <span>
                    Learn from errors
                </span>
            </button>

        </div>
    `;

    chatBox.appendChild(welcome);

    scrollToBottom();
}

</script>

</body>
</html>
